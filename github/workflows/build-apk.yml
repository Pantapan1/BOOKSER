name: Build Android APK (Flutter)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Android project (if missing) & wire up Firebase
        run: |
          PKG="bokser.rlteam.com"
          PKG_PATH=$(echo "$PKG" | tr '.' '/')

          if [ ! -d "android" ]; then
            flutter create --platforms=android --org=com.rlteam --project-name=bokser .
          fi

          # --- applicationId / namespace в gradle ---
          sed -i "s/applicationId\s*=\s*\".*\"/applicationId = \"$PKG\"/" android/app/build.gradle.kts 2>/dev/null || true
          sed -i "s/applicationId\s*\".*\"/applicationId \"$PKG\"/" android/app/build.gradle 2>/dev/null || true
          sed -i "s/namespace\s*=\s*\".*\"/namespace = \"$PKG\"/" android/app/build.gradle.kts 2>/dev/null || true
          sed -i "s/namespace\s*\".*\"/namespace \"$PKG\"/" android/app/build.gradle 2>/dev/null || true

          # --- физически переносим MainActivity в папку/пакет, совпадающий с applicationId ---
          MAIN_ACT=$(find android/app/src/main -iname "MainActivity.*" | head -n 1)
          if [ -n "$MAIN_ACT" ]; then
            EXT="${MAIN_ACT##*.}"
            if [[ "$MAIN_ACT" == *"/kotlin/"* ]]; then
              SRC_ROOT="android/app/src/main/kotlin"
            else
              SRC_ROOT="android/app/src/main/java"
            fi
            NEW_DIR="$SRC_ROOT/$PKG_PATH"
            mkdir -p "$NEW_DIR"
            mv "$MAIN_ACT" "$NEW_DIR/MainActivity.$EXT"
            sed -i "s/^package .*/package $PKG/" "$NEW_DIR/MainActivity.$EXT"
            # чистим пустые старые папки пакета
            find "$SRC_ROOT" -type d -empty -delete
          fi

          cp firebase/google-services.json android/app/google-services.json

          if [ -f android/settings.gradle.kts ] && ! grep -q "com.google.gms.google-services" android/settings.gradle.kts; then
            sed -i '/id("dev.flutter.flutter-plugin-loader")/a\    id("com.google.gms.google-services") version "4.4.2" apply false' android/settings.gradle.kts
          fi
          if [ -f android/settings.gradle ] && ! grep -q "com.google.gms.google-services" android/settings.gradle; then
            echo 'plugins { id "com.google.gms.google-services" version "4.4.2" apply false }' >> android/settings.gradle
          fi

          if [ -f android/app/build.gradle.kts ] && ! grep -q "com.google.gms.google-services" android/app/build.gradle.kts; then
            sed -i '/id("dev.flutter.flutter-gradle-plugin")/a\    id("com.google.gms.google-services")' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ] && ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
            sed -i "/apply plugin: 'dev.flutter.flutter-gradle-plugin'/a apply plugin: 'com.google.gms.google-services'" android/app/build.gradle
          fi

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOKSER-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
