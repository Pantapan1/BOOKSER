name: Unzip and commit project archive

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Find zip archive
        id: findzip
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          fi

      - name: Unzip project archive
        if: steps.findzip.outputs.found == 'true'
        run: unzip -o "${{ steps.findzip.outputs.zip }}" -d .

      - name: Remove zip file
        if: steps.findzip.outputs.found == 'true'
        run: rm -f "${{ steps.findzip.outputs.zip }}"

      - name: Commit and push changes
        if: steps.findzip.outputs.found == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Распаковать проект из архива" || echo "Нечего коммитить"
          git push
