name: bokser
description: BOKSER — нативное Flutter-приложение поверх существующего Firebase (book-2b50d). MVP — лента + профиль + чаты.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase — тот же проект book-2b50d, что и у веб-версии
  firebase_core: ^4.4.0
  firebase_database: ^12.1.3

  provider: ^6.1.2              # простой DI/state management
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.2    # локальная сессия (замена localStorage sr_auth_user)
  crypto: ^3.0.5                # sha256 для hashPassword — совместимо с хэшами уже в auth_users

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
